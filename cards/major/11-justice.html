  "narrativeHtml": "\u003cp>正义是一张关于真实后果的牌。它让情绪安静下来，使事实、责任与因果回到应有的位置。\u003c/p>\u003cp>当这张牌出现，说明你正遇到“公平、因果、判断、责任”的课题。它既可能表现为外部事件，也可能是内心正在成熟的一个阶段。牌面上，一位身着红袍、头戴金冠的正义女神端坐石凳之上：左手握天秤，象征她公正判断一切事物的能力；右手高举利剑，代表她纠正世间一切歪曲与虚伪的力量。女神左脚微微外踏，似要起身，右脚却仍隐于袍中，仿佛在为做出公正裁决而犹豫——这预示着维持公正绝非易事，唯有适当协调他人与自己的对立、时刻审视反省，利剑与天秤才能发挥真正的意义。\u003c/p>\u003cp>正义女神一手持剑，一手持天平，坐在帷幕之前审视事实。她披肩上的方形纽扣中央有一个红色圆形，象征大地、物质与自然力量四种元素的和谐；身后紫色的帷幕象征智慧，两旁的柱子象征正负两面的力量。女神维护正义、力求公平，散发出冷静而凌厉的气质。整张牌呈对称构图，女神面容中正，暗示天秤座追求平衡的特性，而她本身也是法律的化身。\u003c/p>\u003cp>正义这张牌主张秉公办事，合乎逻辑、遵守流程是它的基础。无论你所求问的是什么，只要一直遵守规则、做了该做的事、不做不该做的事，就能顺利度过一些小波折——此时正义牌的出现只是提醒你留意细节；否则，就要小心被正义之剑所惩罚了。它对应占星学上的天秤座，尤其与女皇牌、星币皇后及宝剑宫廷牌相关，其课题包括做出公正而美好的决定、为当前处境承担应有的责任，以及思考如何妥善处理这些问题。\u003c/p>",
