  "narrativeHtml": "\u003cp>塔罗牌女祭司相传是月亮的使者，虔诚，静默却又透着十分的警觉和睿智，是智慧与直觉的象征。相对于魔术师的激情和主动，女祭司只是在深夜中手捧经书默默地祈祷着，似乎是中国传统文化中的阴阳。她不靠言语取胜，而以沉默蓄力；不向外张扬，而向内照见。在魔术师高举权杖、点燃世界之后，女祭司接续登场，提醒人：行动之前，先有觉察；显化之前，先有酝酿。\u003c/p>\u003cp>由图中可以看到，女祭司端坐于石凳之上，手上的卷宗上书写着 Tora，乃律法之一，代表她内心的知性和洞察力，长短分明，善恶明暗，也代表神秘的魔法，静静等待适合行动的时机，并给于明确的指示。身侧的柱子一黑一白，也暗示了她阴阳的强烈观念，理性的思考和判定。白色的头冠和白色的长裙，象征了她内心的纯洁和对洁净的要求。背后的绿叶和果实，既象征她的女性形象，慈爱和娴静，同时也暗示了她具有强大的直觉力和判定力。石榴暗示着希腊神话中的灵后（Persephone）吞下的婚姻不中断的石榴子。她裙角边的月亮，也是智慧和直觉的象征，石榴的含义有欲望和剥开自我的思考力和洞察力。她身后那道横跨的蓝色帷幕，隔开了喧嚣的现实与更深的真理，唯有静心内省的人，才被允许掀开它的一角。\u003c/p>\u003cp>假如说魔术师散发着阳刚的话，那么女祭司则是阴柔的代表，于静寂中凸现沉稳，与寡言中凸显睿智。也有人说，女祭司内心是矛盾的，就像其坐在两根黑白分明的廊柱之间那样，静默却又波涛汹涌，在黑与白，日与夜，正义与邪恶的徘徊中体验生存的意义，感悟人世沧桑。或许正是这份在两极之间反复掂量、不轻易表态的克制，让她变得睿智而富有洞察力。\u003c/p>\u003cp>\u003cb>原型：珀耳塞福涅 (Persephone)\u003c/b>来自古希腊神话，是冥界之后与生命循环的象征。关联牌面中象征生命与秘密的石榴，并代表在沉默与被动中孕育的内在力量与智慧。\u003c/p>",

  "numerologyHtml": "\u003cp>\u003cb>数字 2 的关键词：\u003c/b> 依赖、细心、配合、情绪\u003c/p>\u003cp>\u003cb>数字 2 金钱关键词：\u003c/b> 学习力强、直觉敏感、喜欢团队合作和人互动\u003c/p>\u003cp>\u003cb>数字 2 感情关键词：\u003c/b> 浪漫多情、喜欢温柔体贴、双重性格、情绪化、优柔寡断\u003c/p>\u003cp>\u003cb>数字 2 的人：\u003c/b> 很细心、喜欢有人陪伴她，内在性的数字、心思细腻，感情害怕孤单一定要人陪伴、依赖别人、没有主体性。\u003c/p>\u003cp>\u003cb>塔罗牌：女祭司 (阴性能量)\u003c/b>所有带有 2 的牌能量倾向特质：依赖【吸收别人的能量和受到别人的干扰】。\u003c/p>\u003cul>\u003cli>2 数和 1 数相反，代表接收能量。\u003c/li>\u003cli>2 数的人对份量均衡非常敏感，生怕吃亏，深谙图利之妙，旁人不易占他的便宜。\u003c/li>\u003cli>2 数意识到一体存在着两面，故擅长分析和解决问题，看事情较为透彻。因此天赋有写作、说故事、戏剧表演，甚至有双重人格。\u003c/li>\u003cli>2 数人也擅长比较搭配，对穿着及生活极有品味。\u003c/li>\u003cli>2 课题：如何在和他人互动时也可以独处、不要当别人的负面接收器、不要过度共情别人、管控自己的高需求和情绪化。\u003c/li>\u003c/ul>\u003cp>【2】是二元对立，也是一种分化，代表了精神与物质、灵与肉、生与死、正与反的分别与相对，以及两端相互辨证的思考方式。女祭司正端坐在这「二」的张力之间：黑柱与白柱，满月与新月，理性与直觉，外显与隐藏。她的智慧不在于消除矛盾，而在于安住其中，让两端彼此映照，从中读出更深的真意。\u003c/p>",
  "readingFocusHtml": "\u003cp>女祭司这张牌，描述的是带有「女性内在特质」的人事物——这里并不一定特指某个人，也可以用来形容处理问题时的风格与气质。它偏向接收而非主动，偏向内省而非表达，偏向静默积蓄而非高调显化。\u003c/p>\u003cp>正位的女祭司，像是端庄沉静的大家闺秀：知性、自持、富有洞察，懂得在恰当的时机才开口、才出手。逆位的女祭司，则透出几分刁蛮任性、坐不住、失了平衡的味道：直觉被噪音淹没，内在的声音难以转化为清明的行动，沉默不再是智慧的蓄势，而沦为封闭与回避。读这张牌的关键，正在于辨别这份「静」究竟是成熟的酝酿，还是失衡的退缩。\u003c/p>",
