  "narrativeHtml": "\u003cp>死神骑着白马穿过旧世界，带来无法回头的转化。它清理枯萎之物，为新的生命腾出位置。\u003c/p>\u003cp>当这张牌出现，说明你正遇到“结束、转化、蜕变、新生”的课题。它既可能表现为外部事件，也可能是内心正在成熟的一个阶段。牌面上，死神头戴红色羽毛之帽，手持一面绘有蔷薇十字会图腾的黑色旗帜，骑在一匹白色战马上，高高俯视地上的生灵——这图腾被解读为死后获得新生的过程，或对应火星、象征不朽的生命力。\u003c/p>\u003cp>骷髅骑士骑白马前行，黑旗上有白玫瑰，远处太阳升起。死神的马蹄下有四个人物：国王、圣职者、妇女与儿童，象征人们对死亡的四种态度——国王代表抗拒，终被马蹄无情踩踏；圣职者将令牌置于地上，崇敬并祈求被主引入天堂；妇女跪地，因恐惧而昏厥；天真的孩子因无知而满脸好奇。无论抗拒、崇敬、恐惧还是无知，都揭示同一个真理：无论贫富、男女老少，死亡都是不可抗拒的自然现象，无法逃避，也无需逃避。远方河流是伊甸园四河之一，河中有船；死神脚边的箭头指向一个洞穴，可能是《神曲》中通往阴间的通道。牌的右方一条小径通向两座高塔之间、朝向象征永生的朝阳，寓意死亡并非生命的终点；白马象征纯洁，意味着把过去全部抛弃、从头开始。\u003c/p>\u003cp>通常人们提到“死亡”只联想到肉体的消逝，但在塔罗中，那类灾难性事件更多由塔牌来代表；死神牌所指的，更多是其他形式的“终结”——离开一家公司、完成一篇论文，甚至一次皮肤的新陈代谢，都是终结。从合同到期、婚姻终止，到睡觉、起床，我们无时无刻不在与终结共存，因此抽到死神并非什么大不了的事。真正的课题是“如何面对改变”：人对改变的恐惧，造就了对熟悉模式终结的惊恐。在死神正位时，当事人通常有能力面对即将到来的改变，占卜师只需提醒他做好准备；而由于死神是大牌，这种改变是无法抗拒的。\u003c/p>",
